<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec8ff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#3d7fb4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a1a25" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgba(0,0,0,0.55)" />
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#bg)" />

  <!-- subtle "street" bands -->
  <g opacity="0.22">
    <rect x="-40" y="800" width="920" height="140" fill="#0a0a0f" />
    <rect x="-40" y="940" width="920" height="70" fill="#0a0a0f" />
    <rect x="-40" y="1010" width="920" height="190" fill="#0a0a0f" />
    <rect x="-40" y="870" width="920" height="16" fill="#e6e6f0" opacity="0.25" />
    <rect x="-40" y="910" width="920" height="16" fill="#e6e6f0" opacity="0.25" />
  </g>

  <!-- centered "subject" silhouette -->
  <g filter="url(#softShadow)" opacity="0.95">
    <rect x="210" y="180" width="380" height="820" rx="190" fill="url(#card)" />
    <circle cx="400" cy="260" r="86" fill="rgba(255,255,255,0.22)" />
    <rect x="292" y="350" width="216" height="240" rx="108" fill="rgba(255,255,255,0.18)" />
    <rect x="270" y="610" width="260" height="210" rx="52" fill="rgba(255,255,255,0.14)" />
  </g>

  <!-- label -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">
    <text x="400" y="1060" font-size="22" fill="rgba(255,255,255,0.86)" font-weight="700">
      Base Image
    </text>
    <text x="400" y="1094" font-size="14" fill="rgba(255,255,255,0.68)">
      Upload your image to start editing
    </text>
  </g>
</svg>

