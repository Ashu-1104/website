<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3e8a" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#9b59b6" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#12121a" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.07)" />
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgba(0,0,0,0.55)" />
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#bg2)" />

  <!-- subtle "polish" highlight -->
  <g opacity="0.18">
    <circle cx="160" cy="190" r="120" fill="#e6e6f0" />
    <circle cx="680" cy="330" r="170" fill="#e6e6f0" />
  </g>

  <!-- centered "result" silhouette -->
  <g filter="url(#softShadow2)" opacity="0.96">
    <rect x="210" y="180" width="380" height="820" rx="190" fill="url(#card2)" />
    <circle cx="400" cy="260" r="86" fill="rgba(255,255,255,0.24)" />
    <rect x="282" y="340" width="236" height="260" rx="118" fill="rgba(255,255,255,0.2)" />
    <rect x="265" y="620" width="270" height="260" rx="54" fill="rgba(255,255,255,0.15)" />
  </g>

  <!-- label -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">
    <text x="400" y="1060" font-size="22" fill="rgba(255,255,255,0.9)" font-weight="700">
      Edited Result
    </text>
    <text x="400" y="1094" font-size="14" fill="rgba(255,255,255,0.72)">
      Preview appears after you run an edit
    </text>
  </g>
</svg>

